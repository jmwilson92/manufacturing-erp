<title>Production Orders — Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   FLOW — Production Order workspace prototype
   Industrial control-room treatment. Steel neutrals, cobalt
   signal accent, monospace for every part no. / qty / timer.
   ============================================================ */
:root{
  --bg:#EAEEF4; --surface:#FFFFFF; --surface-2:#F4F7FB; --surface-3:#EDF1F7;
  --border:#D8DFEA; --border-strong:#C3CDDC;
  --ink:#0E1420; --ink-2:#47546B; --ink-3:#7A879E; --ink-4:#A4AFC2;
  --accent:#2F63EB; --accent-ink:#1E4BC0; --accent-soft:#E3EBFD; --accent-line:#B9CCF8;
  --good:#0E8F5E; --good-soft:#DBF3E8;
  --warn:#B5730E; --warn-soft:#FBEED4;
  --crit:#D2333A; --crit-soft:#FBE0E1;
  --info:#3F79C9; --info-soft:#E1ECF9;
  --seq-0:#EDF2FC; --seq-1:#CFDFF8; --seq-2:#A6C4F2; --seq-3:#6E9AE8; --seq-4:#3E6FD6; --seq-5:#274FA8;
  --shadow:0 1px 2px rgba(16,25,45,.06),0 6px 18px rgba(16,25,45,.07);
  --shadow-lg:0 8px 40px rgba(16,25,45,.16);
  --radius:11px; --radius-sm:8px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080B12; --surface:#111826; --surface-2:#0D1420; --surface-3:#161F30;
    --border:#212C42; --border-strong:#2E3B57;
    --ink:#EAF0FB; --ink-2:#A0AEC8; --ink-3:#6B7A98; --ink-4:#4C5A78;
    --accent:#5C86FF; --accent-ink:#8BA9FF; --accent-soft:#17233F; --accent-line:#2C447A;
    --good:#33C88A; --good-soft:#10261E; --warn:#E0A63A; --warn-soft:#2A2010;
    --crit:#F1656B; --crit-soft:#2C1315; --info:#6BA0EE; --info-soft:#12233B;
    --seq-0:#141D30; --seq-1:#1D2F52; --seq-2:#274378; --seq-3:#3A5C9E; --seq-4:#547BD0; --seq-5:#7EA0EA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.36);
    --shadow-lg:0 10px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="light"]{
  --bg:#EAEEF4; --surface:#FFFFFF; --surface-2:#F4F7FB; --surface-3:#EDF1F7;
  --border:#D8DFEA; --border-strong:#C3CDDC;
  --ink:#0E1420; --ink-2:#47546B; --ink-3:#7A879E; --ink-4:#A4AFC2;
  --accent:#2F63EB; --accent-ink:#1E4BC0; --accent-soft:#E3EBFD; --accent-line:#B9CCF8;
  --good:#0E8F5E; --good-soft:#DBF3E8; --warn:#B5730E; --warn-soft:#FBEED4;
  --crit:#D2333A; --crit-soft:#FBE0E1; --info:#3F79C9; --info-soft:#E1ECF9;
  --seq-0:#EDF2FC; --seq-1:#CFDFF8; --seq-2:#A6C4F2; --seq-3:#6E9AE8; --seq-4:#3E6FD6; --seq-5:#274FA8;
  --shadow:0 1px 2px rgba(16,25,45,.06),0 6px 18px rgba(16,25,45,.07);
  --shadow-lg:0 8px 40px rgba(16,25,45,.16);
}
:root[data-theme="dark"]{
  --bg:#080B12; --surface:#111826; --surface-2:#0D1420; --surface-3:#161F30;
  --border:#212C42; --border-strong:#2E3B57;
  --ink:#EAF0FB; --ink-2:#A0AEC8; --ink-3:#6B7A98; --ink-4:#4C5A78;
  --accent:#5C86FF; --accent-ink:#8BA9FF; --accent-soft:#17233F; --accent-line:#2C447A;
  --good:#33C88A; --good-soft:#10261E; --warn:#E0A63A; --warn-soft:#2A2010;
  --crit:#F1656B; --crit-soft:#2C1315; --info:#6BA0EE; --info-soft:#12233B;
  --seq-0:#141D30; --seq-1:#1D2F52; --seq-2:#274378; --seq-3:#3A5C9E; --seq-4:#547BD0; --seq-5:#7EA0EA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.36);
  --shadow-lg:0 10px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:66px 1fr;min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;
  position:sticky;top:0;height:100vh;
}
.rail .logo{
  width:38px;height:38px;border-radius:10px;margin-bottom:12px;
  background:linear-gradient(150deg,var(--accent),var(--accent-ink));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 4px 12px rgba(47,99,235,.35);
}
.rail button.nav{
  width:46px;height:46px;border-radius:11px;border:1px solid transparent;background:transparent;
  color:var(--ink-3);display:grid;place-items:center;position:relative;transition:.14s;
}
.rail button.nav svg{width:21px;height:21px}
.rail button.nav:hover{background:var(--surface-3);color:var(--ink-2)}
.rail button.nav.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.rail button.nav.active::before{content:"";position:absolute;left:-14px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent)}
.rail .tip{
  position:absolute;left:56px;white-space:nowrap;background:var(--ink);color:var(--surface);
  padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;
  transform:translateX(-4px);transition:.13s;z-index:60;box-shadow:var(--shadow)
}
.rail button.nav:hover .tip{opacity:1;transform:translateX(0)}
.rail .spacer{flex:1}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:16px;padding:13px 24px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40
}
.topbar h1{font-size:16px;margin:0;letter-spacing:-.02em;font-weight:700}
.topbar .crumb{color:var(--ink-3);font-size:12.5px;font-weight:600}
.topbar .grow{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  padding:7px 11px;border-radius:9px;color:var(--ink-3);font-size:13px;min-width:210px
}
.search input{border:0;background:transparent;color:var(--ink);outline:none;width:100%;font-family:inherit}
.iconbtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--ink-2);display:grid;place-items:center;transition:.13s
}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.avatar{
  width:34px;height:34px;border-radius:9px;background:var(--surface-3);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink-2)
}
.canvas{padding:22px 24px 60px;max-width:1500px;width:100%}

/* ---------- typography helpers ---------- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink-2);font-size:13px}
.muted{color:var(--ink-3)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}

/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- stat tile ---------- */
.stat{padding:15px 17px;position:relative;overflow:hidden}
.stat .label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat .val{font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:7px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat .val small{font-size:14px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.stat .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;margin-top:8px;font-family:var(--mono)}
.stat .delta.up{color:var(--good)} .stat .delta.down{color:var(--crit)}
.stat .spark{position:absolute;right:14px;bottom:12px;opacity:.9}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap;line-height:1.5
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.tag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:6px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink);font-weight:650;font-size:13px;padding:9px 15px;border-radius:9px;transition:.13s
}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(47,99,235,.28)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.good:hover{filter:brightness(.94)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{background:var(--surface);border-color:var(--border-strong)}
.btn.primary:disabled:hover{background:var(--accent)}

/* ---------- lifecycle stepper ---------- */
.stepper{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.step{flex:1;padding:13px 8px 12px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.step:not(:last-child)::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--border)}
.step .snode{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--border-strong);color:var(--ink-3);background:var(--surface)}
.step .sname{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.step .smeta{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.step.done .snode{background:var(--good);border-color:var(--good);color:#fff}
.step.done .sname{color:var(--ink-2)}
.step.current{background:var(--accent-soft)}
.step.current .snode{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.step.current .sname{color:var(--accent-ink)}
.step svg{width:15px;height:15px}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--border)}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:.1s}
table.tbl tbody tr.click{cursor:pointer}
table.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl .right{text-align:right}

/* ---------- order board (kanban) ---------- */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1200px){.board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.board{grid-template-columns:repeat(2,1fr)}}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;min-height:120px}
.col h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:0 6px;color:var(--ink-2);font-family:var(--mono)}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:.13s;border-left:3px solid var(--border-strong)}
.pcard:hover{border-color:var(--accent-line);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.pcard.sel{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard.pr-hot{border-left-color:var(--crit)}
.pcard.pr-high{border-left-color:var(--warn)}
.pcard .pid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.pcard .pname{font-size:13px;font-weight:650;margin:3px 0 6px;letter-spacing:-.01em;line-height:1.25}
.pcard .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-3)}
.pcard .qty{font-family:var(--mono);font-weight:600;color:var(--ink-2)}
.mini-prog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.mini-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- capacity heatmap ---------- */
.heat{width:100%;border-collapse:separate;border-spacing:3px}
.heat th{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:2px 4px;text-align:center}
.heat td.wc{text-align:left;font-size:12px;font-weight:650;color:var(--ink-2);white-space:nowrap;padding-right:8px}
.heat td.wc small{display:block;color:var(--ink-4);font-weight:500;font-size:10.5px;font-family:var(--mono)}
.cell{height:34px;border-radius:6px;position:relative;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;transition:.1s;border:1px solid transparent}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.cell.over{color:#fff}

/* ---------- detail two-col ---------- */
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}

/* ---------- routing rows ---------- */
.op{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:9px;transition:.13s}
.op:hover{border-color:var(--border-strong)}
.op .drag{color:var(--ink-4);cursor:grab;display:grid;place-items:center}
.op .seq{width:26px;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink-2)}
.op .opmain{flex:1;min-width:0}
.op .opmain b{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.op .opmain .opsub{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.op .opmain .opsub span{display:inline-flex;align-items:center;gap:4px}
.op .optime{font-family:var(--mono);font-weight:600;text-align:right;font-size:12.5px;color:var(--ink-2)}
.op .optime small{display:block;color:var(--ink-4);font-size:10.5px}

/* ---------- checklist ---------- */
.check{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.check .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.check .ck.ok{background:var(--good-soft);color:var(--good)}
.check .ck.no{background:var(--crit-soft);color:var(--crit)}
.check .ck.wait{background:var(--warn-soft);color:var(--warn)}
.check svg{width:14px;height:14px}
.check .cmain b{font-size:13px;font-weight:650}
.check .cmain p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}

/* ---------- floor terminal ---------- */
.floor-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1080px){.floor-grid{grid-template-columns:1fr}}
.opcard{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.opcard .oc-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.opcard .oc-body{padding:15px}
.opcard.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.timer{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qtybox .qb{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center}
.qtybox .qb .qv{font-family:var(--mono);font-size:22px;font-weight:700}
.qtybox .qb .ql{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.qtybox .qb.good .qv{color:var(--good)} .qtybox .qb.scrap .qv{color:var(--crit)}
.stepbtns{display:flex;gap:8px;margin-top:6px}
.stepbtns .btn{flex:1}

/* progress ring */
.ring{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:6}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}

/* ---------- create form ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:.13s
}
.field input.mono{font-family:var(--mono)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.feasibility{border-radius:var(--radius);border:1px dashed var(--border-strong);padding:16px;background:var(--surface-2)}
.feas-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.feas-row:last-child{border-bottom:0}
.feas-row .fi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.feas-row .fm{flex:1}
.feas-row .fm b{font-size:13px;font-weight:650}
.feas-row .fm p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}

/* bar chart (work center load) */
.loadbar{display:flex;align-items:center;gap:10px;padding:8px 0}
.loadbar .lbl{width:120px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loadbar .track{flex:1;height:16px;background:var(--surface-3);border-radius:5px;overflow:hidden;position:relative}
.loadbar .track .fill{height:100%;border-radius:5px 3px 3px 5px}
.loadbar .track .capline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);left:83.3%}
.loadbar .pct{width:48px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:700}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastin .25s ease}
.toast svg{width:16px;height:16px;color:var(--good)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* misc */
.hr{height:1px;background:var(--border);margin:16px 0}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.tooltip{position:fixed;z-index:120;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:var(--shadow-lg);pointer-events:none;opacity:0;transition:opacity .1s;max-width:220px}
.tooltip .tt-t{font-family:var(--mono);font-weight:700;margin-bottom:2px}
.tooltip .tt-s{color:var(--ink-4);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2)}
.legend .sw{display:inline-flex;align-items:center;gap:6px}
.legend .sw i{width:11px;height:11px;border-radius:3px;display:inline-block}
.attn{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.attn.crit{border-color:var(--crit-soft);background:var(--crit-soft)}
.attn.warn{border-color:var(--warn-soft);background:var(--warn-soft)}
.attn .ai{flex:none;margin-top:1px}
.attn.crit .ai{color:var(--crit)} .attn.warn .ai{color:var(--warn)}
.attn b{font-size:13px} .attn p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

<script>
"use strict";
/* ============================================================
   Mock domain model + state that actually flows through stages
   ============================================================ */
const STAGES = [
  {key:"draft",     name:"Draft",      icon:"edit"},
  {key:"routed",    name:"Routed",     icon:"route"},
  {key:"picking",   name:"Picking",    icon:"pick"},
  {key:"released",  name:"Released",   icon:"shield"},
  {key:"production",name:"In Production",icon:"factory"},
  {key:"complete",  name:"Complete",   icon:"check"},
];
const stageIndex = k => STAGES.findIndex(s=>s.key===k);

const WORKCENTERS = [
  {id:"WC-LASER", name:"Laser Cut",   cap:16},
  {id:"WC-BEND",  name:"Press Brake", cap:16},
  {id:"WC-WELD",  name:"Weld Cell",   cap:24},
  {id:"WC-MACH",  name:"CNC Mill",    cap:32},
  {id:"WC-PAINT", name:"Powder Coat", cap:8},
  {id:"WC-ASSY",  name:"Assembly",    cap:40},
  {id:"WC-QA",    name:"Final QA",    cap:8},
];

// standard routing template by product family
function routingFor(family){
  const R = {
    frame:[
      ["WC-LASER","Laser cut frame blanks",0.4,1.2],
      ["WC-BEND","Form channels",0.3,0.8],
      ["WC-WELD","Weld sub-frame",0.6,2.4],
      ["WC-PAINT","Powder coat",0.2,1.5],
      ["WC-ASSY","Assemble & fasten",0.8,3.1],
      ["WC-QA","Final inspection",0.2,0.6],
    ],
    panel:[
      ["WC-LASER","Laser cut panels",0.3,0.9],
      ["WC-BEND","Brake form edges",0.25,0.7],
      ["WC-PAINT","Powder coat",0.2,1.4],
      ["WC-ASSY","Fit hardware",0.5,1.8],
      ["WC-QA","Inspect finish",0.15,0.4],
    ],
    shaft:[
      ["WC-MACH","Turn & mill shaft",0.9,3.6],
      ["WC-MACH","Keyway & drill",0.4,1.4],
      ["WC-QA","CMM inspection",0.3,0.8],
      ["WC-ASSY","Press bearings",0.4,1.2],
    ],
  };
  return (R[family]||R.frame).map((o,i)=>({
    seq:(i+1)*10, wc:o[0], name:o[1], setup:o[2], runEa:o[3],
    status:"pending"
  }));
}

let ORD_SEQ = 4820;
function mkOrder(o){
  const ops = routingFor(o.family);
  return Object.assign({
    id:"PO-"+(ORD_SEQ++),
    priority:"normal",
    picks:[], scrap:0, good:0,
    routing:ops,
    activeOp:0,
  }, o);
}

const state = {
  view:"command",
  orders:[
    mkOrder({product:"Conveyor Drive Frame — 1200mm", part:"FRM-1200-A", qty:24, family:"frame", stage:"production", priority:"high",  due:"Jul 24", good:15, scrap:1, activeOp:3,
      picks:pickset([["STL-CH-3x2","Steel channel 3×2",96,96],["PLT-6MM","6mm plate 1220×2440",6,6],["WELD-ER70","ER70 wire spool",4,4],["PWD-RAL7016","Powder RAL7016 20kg",2,2],["BRG-6208","Bearing 6208-2RS",48,48],["FAS-M10","M10 hardware kit",24,24]]) }),
    mkOrder({product:"Guard Panel Set — Type C", part:"PNL-GC-04", qty:60, family:"panel", stage:"picking", priority:"normal", due:"Jul 26",
      picks:pickset([["SHT-2MM","2mm sheet 1220×2440",30,30],["HNG-SS","Stainless hinge",120,120],["PWD-RAL9005","Powder RAL9005 20kg",3,1],["FAS-M6","M6 hardware kit",60,44]]) }),
    mkOrder({product:"Output Shaft 45mm — Hardened", part:"SHF-45-H", qty:40, family:"shaft", stage:"routed", priority:"hot", due:"Jul 23",
      picks:pickset([["BAR-45-4140","45mm 4140 bar 3m",14,14],["BRG-6209","Bearing 6209-2RS",80,80],["KEY-12","12mm key stock",40,40]]) }),
    mkOrder({product:"Conveyor Drive Frame — 900mm", part:"FRM-900-A", qty:12, family:"frame", stage:"released", priority:"normal", due:"Jul 29",
      picks:pickset([["STL-CH-3x2","Steel channel 3×2",36,36],["PLT-6MM","6mm plate 1220×2440",3,3],["WELD-ER70","ER70 wire spool",2,2],["PWD-RAL7016","Powder RAL7016 20kg",1,1],["BRG-6208","Bearing 6208-2RS",24,24],["FAS-M10","M10 hardware kit",12,12]]) }),
    mkOrder({product:"Guard Panel Set — Type A", part:"PNL-GA-01", qty:36, family:"panel", stage:"draft", priority:"normal", due:"Aug 02", picks:[] }),
    mkOrder({product:"Output Shaft 60mm", part:"SHF-60", qty:20, family:"shaft", stage:"complete", priority:"normal", due:"Jul 18", good:20, scrap:0, activeOp:4,
      picks:pickset([["BAR-60-4140","60mm 4140 bar 3m",7,7],["BRG-6212","Bearing 6212-2RS",40,40],["KEY-16","16mm key stock",20,20]]) }),
  ],
  selected:null,
  timer:{running:false, seconds:4517, order:null},
};
function pickset(rows){return rows.map(r=>({part:r[0],name:r[1],need:r[2],avail:r[3],picked:0,bin:randbin()}));}
function randbin(){const a="ABCDEF"[Math.floor(Math.random()*6)];const b=String(Math.floor(Math.random()*40)+1).padStart(2,"0");const c=String(Math.floor(Math.random()*5)+1);return `${a}-${b}-${c}`;}
state.selected = state.orders[0].id;

/* capacity: load per work center per day (hours committed) over 10 days */
const DAYS = ["Mon 21","Tue 22","Wed 23","Thu 24","Fri 25","Mon 28","Tue 29","Wed 30","Thu 31","Fri 01"];
function buildLoad(){
  // deterministic-ish pseudo load derived from orders + noise
  const seedbase = {"WC-LASER":[9,11,14,13,10,8,12,15,11,9],"WC-BEND":[7,9,12,10,8,6,9,11,9,7],
    "WC-WELD":[14,18,22,26,20,16,19,23,18,15],"WC-MACH":[20,24,30,28,25,22,27,31,26,21],
    "WC-PAINT":[5,6,8,9,7,4,6,9,7,5],"WC-ASSY":[26,31,36,34,30,28,33,38,32,27],"WC-QA":[4,5,7,8,6,3,5,8,6,4]};
  return WORKCENTERS.map(wc=>({wc, cap:wc.cap, load:seedbase[wc.id]}));
}
const CAPACITY = buildLoad();

/* ============================================================ icons */
const I = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h6a4 4 0 0 0 4-4V7"/></svg>',
  pick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1 12H5z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 9.5C8 20.3 5 16.5 5 12V6z"/></svg>',
  factory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V10l6 4V10l6 4V7l6 3v11z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  checkc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  drag:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
};

/* ============================================================ helpers */
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function stageOf(o){return o.stage;}
function pri(o){return o.priority;}
function priPill(p){
  if(p==="hot")return '<span class="pill crit"><span class="dot"></span>Hot</span>';
  if(p==="high")return '<span class="pill warn"><span class="dot"></span>High</span>';
  return '<span class="pill neutral">Normal</span>';
}
function shortCount(o){return o.picks.filter(p=>p.avail<p.need).length;}
function pickProgress(o){if(!o.picks.length)return 0;const t=o.picks.reduce((a,p)=>a+p.need,0);const d=o.picks.reduce((a,p)=>a+Math.min(p.picked,p.need),0);return Math.round(d/t*100);}
function opProgress(o){const done=o.routing.filter(r=>r.status==="done").length;return Math.round(done/o.routing.length*100);}
function toast(msg){
  const t=el(`<div class="toast">${I.checkc}<span>${msg}</span></div>`);
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(8px)";setTimeout(()=>t.remove(),250);},2600);
}
function seqColor(pct){ // 0..100 sequential blue, >100 critical
  if(pct>100)return null;
  const stops=["--seq-0","--seq-1","--seq-2","--seq-3","--seq-4","--seq-5"];
  const i=Math.min(5,Math.floor(pct/100*5.999));
  return `var(${stops[i]})`;
}
function selOrder(){return state.orders.find(o=>o.id===state.selected);}

/* ============================================================ router */
const VIEW_META={
  command:["Command center","Shop-wide status"],
  create:["New production order","Draft with live feasibility"],
  routing:["Routing","Operations & work centers"],
  pick:["Pick & issue","Stage components to the floor"],
  release:["Sign-off & release","Readiness gate"],
  floor:["Floor terminal","Operator execution"],
  capacity:["Capacity planning","Finite load by work center"],
};
function go(view){
  state.view=view;
  document.querySelectorAll(".rail .nav").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  const m=VIEW_META[view]||["",""];
  document.getElementById("viewTitle").textContent=m[0];
  document.getElementById("viewCrumb").textContent=m[1];
  render();
  document.querySelector(".main").scrollTo({top:0});
  window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll(".rail .nav[data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));

/* ============================================================ RENDER */
const canvas=document.getElementById("canvas");
function render(){
  canvas.innerHTML="";
  ({command:viewCommand,create:viewCreate,routing:viewRouting,pick:viewPick,
    release:viewRelease,floor:viewFloor,capacity:viewCapacity}[state.view])();
}

/* -------- lifecycle stepper (shared spine) -------- */
function stepper(o){
  const cur=stageIndex(o.stage);
  const meta=(k)=>{
    if(k==="picking")return `${pickProgress(o)}% staged`;
    if(k==="production")return `${opProgress(o)}% ops`;
    if(k==="routed")return `${o.routing.length} ops`;
    if(k==="complete")return `${o.good}/${o.qty} good`;
    return "";
  };
  return `<div class="stepper" role="list">${STAGES.map((s,i)=>{
    const cls=i<cur?"done":i===cur?"current":"";
    const ic=i<cur?I.check:I[s.icon];
    return `<div class="step ${cls}" role="listitem">
      <div class="snode">${i<cur?I.check:`<span>${i+1}</span>`}</div>
      <div class="sname">${s.name}</div>
      <div class="smeta">${meta(s.key)}</div>
    </div>`;}).join("")}</div>`;
}

/* -------- order context header (shared) -------- */
function orderHeader(o,actionHtml){
  return `<div class="card pad" style="margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div>
      <div class="row" style="gap:9px">
        <span class="tag">${o.id}</span>${priPill(o.priority)}
        <span class="pill accent">${o.part}</span>
      </div>
      <div style="font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:7px">${o.product}</div>
    </div>
    <div class="grow" style="flex:1"></div>
    <div style="text-align:right">
      <div class="eyebrow">Quantity</div>
      <div class="num" style="font-size:20px;font-weight:700">${o.qty}<small style="color:var(--ink-3);font-weight:600"> ea</small></div>
    </div>
    <div style="text-align:right">
      <div class="eyebrow">Due</div>
      <div class="num" style="font-size:20px;font-weight:700">${o.due}</div>
    </div>
    ${actionHtml||""}
  </div>`;
}

/* order picker dropdown used across stage views */
function orderPicker(){
  const opts=state.orders.map(o=>`<option value="${o.id}" ${o.id===state.selected?"selected":""}>${o.id} · ${o.product}</option>`).join("");
  return `<div class="row" style="margin-bottom:16px">
    <span class="eyebrow">Working order</span>
    <select id="ordSel" style="min-width:340px;padding:8px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">${opts}</select>
    <span class="crumb">Stage: <b style="color:var(--ink-2)">${STAGES[stageIndex(selOrder().stage)].name}</b></span>
  </div>`;
}
function wireOrderPicker(){
  const s=document.getElementById("ordSel");
  if(s)s.addEventListener("change",()=>{state.selected=s.value;render();});
}

/* ============================================================ 1. COMMAND CENTER */
function viewCommand(){
  const onFloor=state.orders.filter(o=>o.stage==="production").length;
  const late=state.orders.filter(o=>["Jul 18","Jul 23"].includes(o.due)&&o.stage!=="complete").length;
  const shortages=state.orders.reduce((a,o)=>a+shortCount(o),0);
  const wip=state.orders.filter(o=>!["complete","draft"].includes(o.stage)).length;

  canvas.appendChild(el(`<div class="grid kpis" style="margin-bottom:18px">
    ${statTile("Open WIP","",wip,"orders","up","+2 vs last wk",spark([4,5,5,6,5,7,6]))}
    ${statTile("On the floor","",onFloor,"running","up","live",spark([1,1,2,1,2,2,2]))}
    ${statTile("Late / at-risk","",late,"orders", late? "down":"up", late?"needs action":"clear",spark([2,1,1,2,1,1,1]),late?"crit":null)}
    ${statTile("Material shortages","",shortages,"lines",shortages?"down":"up",shortages?"1 blocking":"none",spark([3,2,2,1,2,1,1]),shortages?"warn":null)}
  </div>`));

  // attention strip
  const attn=el(`<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px"></div>`);
  attn.appendChild(el(`<div class="attn crit"><span class="ai">${I.alert}</span><div><b>PO-4822 · Output Shaft 45mm is hot &amp; due Jul 23</b><p>Routed but not picked — 0% staged. Start picking to hold the date.</p></div></div>`));
  attn.appendChild(el(`<div class="attn warn"><span class="ai">${I.alert}</span><div><b>PO-4819 · Guard Panel Set short on RAL9005 powder</b><p>Need 3, only 1 on hand. Backorder 2 or substitute finish before release.</p></div></div>`));
  canvas.appendChild(attn);

  // board + capacity
  const split=el(`<div class="grid" style="grid-template-columns:1fr;gap:18px"></div>`);
  // Kanban board
  const boardWrap=el(`<div class="card pad"></div>`);
  boardWrap.appendChild(el(`<div class="section-head"><div><div class="eyebrow">Live pipeline</div><h3 class="h2">Every order, one glance</h3></div>
    <button class="btn primary sm" id="newBtn">${I.plus}New order</button></div>`));
  const board=el(`<div class="board"></div>`);
  STAGES.forEach(s=>{
    const items=state.orders.filter(o=>o.stage===s.key);
    const col=el(`<div class="col"><h4>${s.name}<span class="cnt">${items.length}</span></h4></div>`);
    items.forEach(o=>{

function statTile(label,pre,val,unit,dir,delta,sparkSvg,tone){
  const dc = dir==="up"?"up":"down";
  return `<div class="card stat">
    <div class="label">${label}</div>
    <div class="val">${pre}${val}<small> ${unit}</small></div>

    <div class="spark">${sparkSvg}</div>
  </div>`;

function spark(vals){
  const w=64,h=26,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-((v-min)/rng)*(h-4)-2]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M0 ${h} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${w} ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${d}" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.4" fill="var(--accent)"/>
  </svg>`;
}

function genPicks(family,qty){
  const base={

function enableDrag(container,o){
  let dragEl=null;
  container.querySelectorAll(".op").forEach(row=>{
    row.addEventListener("dragstart",e=>{dragEl=row;row.style.opacity=".4";});
    row.addEventListener("dragend",()=>{if(dragEl)dragEl.style.opacity="";dragEl=null;});
    row.addEventListener("dragover",e=>{e.preventDefault();
      const rect=row.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;
      if(dragEl&&dragEl!==row){row.parentNode.insertBefore(dragEl,after?row.nextSibling:row);}});
  });
  container.addEventListener("drop",e=>{e.preventDefault();
    const order=[...container.querySelectorAll(".op")].map(r=>o.routing[+r.dataset.i]);
    o.routing=order.map((op,i)=>({...op,seq:(i+1)*10}));
    toast("Routing reordered");render();});
}

  split.appendChild(right);
  canvas.appendChild(orderHeaderNode(o));
  canvas.appendChild(split);

  const rb=document.getElementById("releaseBtn");
  if(rb&&!released)rb.addEventListener("click",()=>{o.stage="production";o.activeOp=0;o.routing.forEach(r=>r.status="pending");if(o.routing[0])o.routing[0].status="active";state.timer.order=o.id;toast(`${o.id} released to the floor`);go("floor");});
}
function orderHeaderNode(o){const d=el("<div></div>");d.innerHTML=orderHeader(o,"");d.style.marginBottom="0";return d.firstElementChild;}

/* ============================================================ 6. FLOOR TERMINAL */
let timerHandle=null;
function viewFloor(){
  const running=state.orders.filter(o=>o.stage==="production");
  canvas.appendChild(el(`<div class="row" style="margin-bottom:16px;justify-content:space-between">
    <div><div class="eyebrow">Floor terminal</div><h2 class="h2">On the floor now</h2></div>
    <div class="wrap" id="floorTabs"></div></div>`));
  const tabs=document.getElementById("floorTabs");
  running.forEach(o=>{
    const b=el(`<button class="btn sm ${o.id===state.selected?'primary':''}">${o.id} · ${o.part}</button>`);
    b.addEventListener("click",()=>{state.selected=o.id;render();});
    tabs.appendChild(b);
  });
  let o=selOrder();
  if(!o||o.stage!=="production"){o=running[0];if(o)state.selected=o.id;}
  if(!o){canvas.appendChild(el(`<div class="card pad muted">No orders on the floor. Release one from sign-off.</div>`));return;}

  canvas.appendChild(el(`<div style="margin-bottom:16px">${stepper(o)}</div>`));

  const activeIdx=o.routing.findIndex(r=>r.status==="active");
  const cur=activeIdx>=0?activeIdx:o.routing.findIndex(r=>r.status!=="done");
  const grid=el(`<div class="floor-grid"></div>`);

  o.routing.forEach((op,i)=>{
    const wc=WORKCENTERS.find(w=>w.id===op.wc);
    const isActive=i===cur && o.routing.some(r=>r.status==="active");
    const isDone=op.status==="done";
    const isNext=i===cur && !isActive;
    const pctDone=isDone?100:isActive?Math.round(o.good/o.qty*100):0;
    const card=el(`<div class="opcard ${isActive?'active':''}">
      <div class="oc-head">
        <div class="row"><span class="seq">${op.seq}</span><div><b style="font-size:13.5px">${op.name}</b><br><span class="tag" style="font-size:11px">${wc.name}</span></div></div>
        ${isDone?'<span class="pill good"><span class="dot"></span>Done</span>':isActive?'<span class="pill accent"><span class="dot"></span>Running</span>':'<span class="pill neutral">Queued</span>'}
      </div>
      <div class="oc-body"></div></div>`);
    const body=card.querySelector(".oc-body");
    if(isActive){
      body.appendChild(el(`<div class="row" style="justify-content:space-between;align-items:center">
        <div><div class="eyebrow">Run time</div><div class="timer" id="floorTimer">${fmtTime(state.timer.seconds)}</div></div>
        ${ring(o.good/o.qty)}
      </div>`));
      body.appendChild(el(`<div class="qtybox">
        <div class="qb good"><div class="qv" id="qGood">${o.good}</div><div class="ql">Good</div></div>
        <div class="qb scrap"><div class="qv" id="qScrap">${o.scrap}</div><div class="ql">Scrap</div></div>
      </div>`));
      body.appendChild(el(`<div class="stepbtns"><button class="btn sm" id="repGood">+ Good</button><button class="btn sm" id="repScrap">+ Scrap</button></div>`));
      body.appendChild(el(`<div class="stepbtns" style="margin-top:10px">
        <button class="btn ${state.timer.running?'':'primary'}" id="toggleRun">${state.timer.running?I.pause+'Pause':I.play+'Start'}</button>
        <button class="btn good" id="completeOp">${I.checkc}Complete op</button></div>`));
    } else if(isDone){
      body.appendChild(el(`<div class="row" style="justify-content:space-between"><span class="sub">Reported good</span><b class="num">${op._good??o.qty}</b></div>
        <div class="row" style="justify-content:space-between;margin-top:6px"><span class="sub">Cycle</span><b class="num">${op._cycle||((op.setup+op.runEa*o.qty).toFixed(1)+'h')}</b></div>
        <div class="mini-prog" style="margin-top:12px"><i style="width:100%;background:var(--good)"></i></div>`));
    } else {
      body.appendChild(el(`<div class="sub">Queued at ${wc.name}.</div>
        <div class="row" style="justify-content:space-between;margin-top:10px"><span class="sub">Std time</span><b class="num">${(op.setup+op.runEa*o.qty).toFixed(1)}h</b></div>
        ${isNext?`<button class="btn sm primary" id="startNext" style="width:100%;margin-top:12px">${I.play}Start operation</button>`:""}`));
    }
    grid.appendChild(card);
  });
  canvas.appendChild(grid);

  // wire
  const tr=document.getElementById("toggleRun");
  if(tr)tr.addEventListener("click",()=>{state.timer.running=!state.timer.running;state.timer.order=o.id;tickSetup();render();});
  const rg=document.getElementById("repGood");
  if(rg)rg.addEventListener("click",()=>{if(o.good<o.qty){o.good++;document.getElementById("qGood").textContent=o.good;updateRing(o);}else toast("Order quantity reached");});
  const rs=document.getElementById("repScrap");
  if(rs)rs.addEventListener("click",()=>{o.scrap++;document.getElementById("qScrap").textContent=o.scrap;toast("Scrap logged");});
  const co=document.getElementById("completeOp");
  if(co)co.addEventListener("click",()=>completeOp(o,cur));
  const sn=document.getElementById("startNext");
  if(sn)sn.addEventListener("click",()=>{o.routing[cur].status="active";state.timer.running=true;state.timer.seconds=0;tickSetup();render();});
  tickSetup();
}
function completeOp(o,i){
  o.routing[i].status="done"; o.routing[i]._good=o.good; o.routing[i]._cycle=fmtTime(state.timer.seconds);
  state.timer.running=false;
  const next=o.routing.findIndex(r=>r.status!=="done");
  if(next>=0){o.routing[next].status="active";state.timer.seconds=0;toast(`Op complete — advancing to ${o.routing[next].name}`);}
  else{o.stage="complete";toast(`${o.id} complete — ${o.good} good, ${o.scrap} scrap`);go("command");return;}
  render();
}
function ring(frac){
  const r=26,c=2*Math.PI*r,off=c*(1-Math.min(frac,1));
  return `<svg width="64" height="64" class="ring" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="${r}"/><circle class="prog" id="floorRing" cx="32" cy="32" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}
function updateRing(o){const ring=document.getElementById("floorRing");if(!ring)return;const r=26,c=2*Math.PI*r;ring.style.strokeDashoffset=(c*(1-Math.min(o.good/o.qty,1))).toFixed(1);}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;}
function tickSetup(){
  if(timerHandle)clearInterval(timerHandle);
  if(state.timer.running){
    timerHandle=setInterval(()=>{
      state.timer.seconds++;
      const t=document.getElementById("floorTimer");
      if(t)t.textContent=fmtTime(state.timer.seconds);
      else{clearInterval(timerHandle);}
    },1000);
  }
}

/* ============================================================ 7. CAPACITY PLANNING */
function viewCapacity(){
  canvas.appendChild(el(`<div class="section-head"><div><div class="eyebrow">Finite scheduling</div><h2 class="h2">Capacity by work center</h2><p class="sub">Committed load vs. available hours per day. Red cells are over capacity — rebalance before they bite.</p></div>
    <div class="legend"><span class="sw"><i style="background:var(--seq-1)"></i>light</span><span class="sw"><i style="background:var(--seq-3)"></i>busy</span><span class="sw"><i style="background:var(--seq-5)"></i>near full</span><span class="sw"><i style="background:var(--crit)"></i>over</span></div>
  </div>`));

  const wrap=el(`<div class="card pad" style="overflow-x:auto"></div>`);
  const t=el(`<table class="heat"><thead><tr><th style="text-align:left">Work center</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody></tbody></table>`);
  const tb=t.querySelector("tbody");
  CAPACITY.forEach(row=>{
    const tr=el(`<tr><td class="wc">${row.wc.name}<small>${row.wc.id} · ${row.cap}h/day</small></td></tr>`);
    row.load.forEach((h,di)=>{
      const pct=Math.round(h/row.cap*100);
      const over=pct>100;
      const bg=over?"var(--crit)":seqColor(pct);
      const cell=el(`<td><div class="cell ${over?'over':''}" style="background:${bg}" data-tt="${row.wc.name} · ${DAYS[di]}" data-tt2="${h}h of ${row.cap}h — ${pct}%">${pct}%</div></td>`);
      tr.appendChild(cell);
    });
    tb.appendChild(tr);
  });
  wrap.appendChild(t);
  canvas.appendChild(wrap);

  // summary row: bottlenecks
  const overCells=[];
  CAPACITY.forEach(row=>row.load.forEach((h,di)=>{if(h/row.cap>1)overCells.push({wc:row.wc.name,day:DAYS[di],pct:Math.round(h/row.cap*100)});}));
  const s=el(`<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-top:18px"></div>`);
  const b1=el(`<div class="card pad"></div>`);
  b1.appendChild(el(`<div class="eyebrow" style="margin-bottom:10px">Overloaded slots · ${overCells.length}</div>`));
  if(overCells.length){overCells.slice(0,5).forEach(c=>b1.appendChild(el(`<div class="attn warn" style="margin-bottom:8px"><span class="ai">${I.alert}</span><div><b>${c.wc} — ${c.day}</b><p>Committed to ${c.pct}% of capacity. Pull work earlier or add a shift.</p></div></div>`)));}
  else b1.appendChild(el(`<div class="sub">Nothing over capacity this window.</div>`));
  s.appendChild(b1);

  const b2=el(`<div class="card pad"></div>`);
  b2.appendChild(el(`<div class="eyebrow" style="margin-bottom:10px">This week's peak per work center</div>`));
  CAPACITY.forEach(row=>{
    const peak=Math.max(...row.load); const pct=Math.round(peak/row.cap*100);
    const over=pct>100;
    b2.appendChild(el(`<div class="loadbar"><span class="lbl">${row.wc.name}</span>
      <span class="track"><span class="fill" style="width:${Math.min(pct,100)}%;background:${over?'var(--crit)':pct>85?'var(--warn)':'var(--accent)'}"></span><span class="capline"></span></span>
      <span class="pct" style="color:${over?'var(--crit)':'var(--ink-2)'}">${pct}%</span></div>`));
  });
  s.appendChild(b2);
  canvas.appendChild(s);

  // tooltips
  const tip=document.getElementById("tooltip");
  wrap.querySelectorAll(".cell").forEach(c=>{
    c.addEventListener("mousemove",e=>{tip.innerHTML=`<div class="tt-t">${c.dataset.tt}</div><div class="tt-s">${c.dataset.tt2}</div>`;
      tip.style.opacity="1";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px";});
    c.addEventListener("mouseleave",()=>tip.style.opacity="0");
  });
}

/* ============================================================ theme toggle */
document.getElementById("themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");
});

/* ============================================================ boot */
go("command");
</script>
