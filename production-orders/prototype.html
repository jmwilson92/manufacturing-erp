<title>Production Orders — Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   FLOW — Production Order workspace prototype
   Industrial control-room treatment. Steel neutrals, cobalt
   signal accent, monospace for every part no. / qty / timer.
   ============================================================ */
:root{
  --bg:#EAEEF4; --surface:#FFFFFF; --surface-2:#F4F7FB; --surface-3:#EDF1F7;
  --border:#D8DFEA; --border-strong:#C3CDDC;
  --ink:#0E1420; --ink-2:#47546B; --ink-3:#7A879E; --ink-4:#A4AFC2;
  --accent:#2F63EB; --accent-ink:#1E4BC0; --accent-soft:#E3EBFD; --accent-line:#B9CCF8;
  --good:#0E8F5E; --good-soft:#DBF3E8;
  --warn:#B5730E; --warn-soft:#FBEED4;
  --crit:#D2333A; --crit-soft:#FBE0E1;
  --info:#3F79C9; --info-soft:#E1ECF9;
  --seq-0:#EDF2FC; --seq-1:#CFDFF8; --seq-2:#A6C4F2; --seq-3:#6E9AE8; --seq-4:#3E6FD6; --seq-5:#274FA8;
  --shadow:0 1px 2px rgba(16,25,45,.06),0 6px 18px rgba(16,25,45,.07);
  --shadow-lg:0 8px 40px rgba(16,25,45,.16);
  --radius:11px; --radius-sm:8px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080B12; --surface:#111826; --surface-2:#0D1420; --surface-3:#161F30;
    --border:#212C42; --border-strong:#2E3B57;
    --ink:#EAF0FB; --ink-2:#A0AEC8; --ink-3:#6B7A98; --ink-4:#4C5A78;
    --accent:#5C86FF; --accent-ink:#8BA9FF; --accent-soft:#17233F; --accent-line:#2C447A;
    --good:#33C88A; --good-soft:#10261E; --warn:#E0A63A; --warn-soft:#2A2010;
    --crit:#F1656B; --crit-soft:#2C1315; --info:#6BA0EE; --info-soft:#12233B;
    --seq-0:#141D30; --seq-1:#1D2F52; --seq-2:#274378; --seq-3:#3A5C9E; --seq-4:#547BD0; --seq-5:#7EA0EA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.36);
    --shadow-lg:0 10px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="light"]{
  --bg:#EAEEF4; --surface:#FFFFFF; --surface-2:#F4F7FB; --surface-3:#EDF1F7;
  --border:#D8DFEA; --border-strong:#C3CDDC;
  --ink:#0E1420; --ink-2:#47546B; --ink-3:#7A879E; --ink-4:#A4AFC2;
  --accent:#2F63EB; --accent-ink:#1E4BC0; --accent-soft:#E3EBFD; --accent-line:#B9CCF8;
  --good:#0E8F5E; --good-soft:#DBF3E8; --warn:#B5730E; --warn-soft:#FBEED4;
  --crit:#D2333A; --crit-soft:#FBE0E1; --info:#3F79C9; --info-soft:#E1ECF9;
  --seq-0:#EDF2FC; --seq-1:#CFDFF8; --seq-2:#A6C4F2; --seq-3:#6E9AE8; --seq-4:#3E6FD6; --seq-5:#274FA8;
  --shadow:0 1px 2px rgba(16,25,45,.06),0 6px 18px rgba(16,25,45,.07);
  --shadow-lg:0 8px 40px rgba(16,25,45,.16);
}
:root[data-theme="dark"]{
  --bg:#080B12; --surface:#111826; --surface-2:#0D1420; --surface-3:#161F30;
  --border:#212C42; --border-strong:#2E3B57;
  --ink:#EAF0FB; --ink-2:#A0AEC8; --ink-3:#6B7A98; --ink-4:#4C5A78;
  --accent:#5C86FF; --accent-ink:#8BA9FF; --accent-soft:#17233F; --accent-line:#2C447A;
  --good:#33C88A; --good-soft:#10261E; --warn:#E0A63A; --warn-soft:#2A2010;
  --crit:#F1656B; --crit-soft:#2C1315; --info:#6BA0EE; --info-soft:#12233B;
  --seq-0:#141D30; --seq-1:#1D2F52; --seq-2:#274378; --seq-3:#3A5C9E; --seq-4:#547BD0; --seq-5:#7EA0EA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.36);
  --shadow-lg:0 10px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:66px 1fr;min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;
  position:sticky;top:0;height:100vh;
}
.rail .logo{
  width:38px;height:38px;border-radius:10px;margin-bottom:12px;
  background:linear-gradient(150deg,var(--accent),var(--accent-ink));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 4px 12px rgba(47,99,235,.35);
}
.rail button.nav{
  width:46px;height:46px;border-radius:11px;border:1px solid transparent;background:transparent;
  color:var(--ink-3);display:grid;place-items:center;position:relative;transition:.14s;
}
.rail button.nav svg{width:21px;height:21px}
.rail button.nav:hover{background:var(--surface-3);color:var(--ink-2)}
.rail button.nav.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.rail button.nav.active::before{content:"";position:absolute;left:-14px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent)}
.rail .tip{
  position:absolute;left:56px;white-space:nowrap;background:var(--ink);color:var(--surface);
  padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;
  transform:translateX(-4px);transition:.13s;z-index:60;box-shadow:var(--shadow)
}
.rail button.nav:hover .tip{opacity:1;transform:translateX(0)}
.rail .spacer{flex:1}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:16px;padding:13px 24px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40
}
.topbar h1{font-size:16px;margin:0;letter-spacing:-.02em;font-weight:700}
.topbar .crumb{color:var(--ink-3);font-size:12.5px;font-weight:600}
.topbar .grow{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  padding:7px 11px;border-radius:9px;color:var(--ink-3);font-size:13px;min-width:210px
}
.search input{border:0;background:transparent;color:var(--ink);outline:none;width:100%;font-family:inherit}
.iconbtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--ink-2);display:grid;place-items:center;transition:.13s
}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.avatar{
  width:34px;height:34px;border-radius:9px;background:var(--surface-3);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink-2)
}
.canvas{padding:22px 24px 60px;max-width:1500px;width:100%}

/* ---------- typography helpers ---------- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink-2);font-size:13px}
.muted{color:var(--ink-3)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}

/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- stat tile ---------- */
.stat{padding:15px 17px;position:relative;overflow:hidden}
.stat .label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat .val{font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:7px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat .val small{font-size:14px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.stat .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;margin-top:8px;font-family:var(--mono)}
.stat .delta.up{color:var(--good)} .stat .delta.down{color:var(--crit)}
.stat .spark{position:absolute;right:14px;bottom:12px;opacity:.9}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap;line-height:1.5
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.tag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:6px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink);font-weight:650;font-size:13px;padding:9px 15px;border-radius:9px;transition:.13s
}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(47,99,235,.28)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.good:hover{filter:brightness(.94)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{background:var(--surface);border-color:var(--border-strong)}
.btn.primary:disabled:hover{background:var(--accent)}

/* ---------- lifecycle stepper ---------- */
.stepper{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.step{flex:1;padding:13px 8px 12px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.step:not(:last-child)::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--border)}
.step .snode{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--border-strong);color:var(--ink-3);background:var(--surface)}
.step .sname{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.step .smeta{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.step.done .snode{background:var(--good);border-color:var(--good);color:#fff}
.step.done .sname{color:var(--ink-2)}
.step.current{background:var(--accent-soft)}
.step.current .snode{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.step.current .sname{color:var(--accent-ink)}
.step svg{width:15px;height:15px}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--border)}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:.1s}
table.tbl tbody tr.click{cursor:pointer}
table.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl .right{text-align:right}

/* ---------- order board (kanban) ---------- */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1200px){.board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.board{grid-template-columns:repeat(2,1fr)}}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;min-height:120px}
.col h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:0 6px;color:var(--ink-2);font-family:var(--mono)}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:.13s;border-left:3px solid var(--border-strong)}
.pcard:hover{border-color:var(--accent-line);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.pcard.sel{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard.pr-hot{border-left-color:var(--crit)}
.pcard.pr-high{border-left-color:var(--warn)}
.pcard .pid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.pcard .pname{font-size:13px;font-weight:650;margin:3px 0 6px;letter-spacing:-.01em;line-height:1.25}
.pcard .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-3)}
.pcard .qty{font-family:var(--mono);font-weight:600;color:var(--ink-2)}
.mini-prog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.mini-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- capacity heatmap ---------- */
.heat{width:100%;border-collapse:separate;border-spacing:3px}
.heat th{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:2px 4px;text-align:center}
.heat td.wc{text-align:left;font-size:12px;font-weight:650;color:var(--ink-2);white-space:nowrap;padding-right:8px}
.heat td.wc small{display:block;color:var(--ink-4);font-weight:500;font-size:10.5px;font-family:var(--mono)}
.cell{height:34px;border-radius:6px;position:relative;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;transition:.1s;border:1px solid transparent}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.cell.over{color:#fff}

/* ---------- detail two-col ---------- */
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}

/* ---------- routing rows ---------- */
.op{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:9px;transition:.13s}
.op:hover{border-color:var(--border-strong)}
.op .drag{color:var(--ink-4);cursor:grab;display:grid;place-items:center}
.op .seq{width:26px;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink-2)}
.op .opmain{flex:1;min-width:0}
.op .opmain b{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.op .opmain .opsub{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.op .opmain .opsub span{display:inline-flex;align-items:center;gap:4px}
.op .optime{font-family:var(--mono);font-weight:600;text-align:right;font-size:12.5px;color:var(--ink-2)}
.op .optime small{display:block;color:var(--ink-4);font-size:10.5px}

/* ---------- checklist ---------- */
.check{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.check .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.check .ck.ok{background:var(--good-soft);color:var(--good)}
.check .ck.no{background:var(--crit-soft);color:var(--crit)}
.check .ck.wait{background:var(--warn-soft);color:var(--warn)}
.check svg{width:14px;height:14px}
.check .cmain b{font-size:13px;font-weight:650}
.check .cmain p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}

/* ---------- floor terminal ---------- */
.floor-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1080px){.floor-grid{grid-template-columns:1fr}}
.opcard{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.opcard .oc-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.opcard .oc-body{padding:15px}
.opcard.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.timer{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qtybox .qb{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center}
.qtybox .qb .qv{font-family:var(--mono);font-size:22px;font-weight:700}
.qtybox .qb .ql{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.qtybox .qb.good .qv{color:var(--good)} .qtybox .qb.scrap .qv{color:var(--crit)}
.stepbtns{display:flex;gap:8px;margin-top:6px}
.stepbtns .btn{flex:1}

/* progress ring */
.ring{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:6}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}

/* ---------- create form ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:.13s
}
.field input.mono{font-family:var(--mono)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.feasibility{border-radius:var(--radius);border:1px dashed var(--border-strong);padding:16px;background:var(--surface-2)}
.feas-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.feas-row:last-child{border-bottom:0}
.feas-row .fi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.feas-row .fm{flex:1}
.feas-row .fm b{font-size:13px;font-weight:650}
.feas-row .fm p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}

/* bar chart (work center load) */
.loadbar{display:flex;align-items:center;gap:10px;padding:8px 0}
.loadbar .lbl{width:120px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loadbar .track{flex:1;height:16px;background:var(--surface-3);border-radius:5px;overflow:hidden;position:relative}
.loadbar .track .fill{height:100%;border-radius:5px 3px 3px 5px}
.loadbar .track .capline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);left:83.3%}
.loadbar .pct{width:48px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:700}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastin .25s ease}
.toast svg{width:16px;height:16px;color:var(--good)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* misc */
.hr{height:1px;background:var(--border);margin:16px 0}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.tooltip{position:fixed;z-index:120;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:var(--shadow-lg);pointer-events:none;opacity:0;transition:opacity .1s;max-width:220px}
.tooltip .tt-t{font-family:var(--mono);font-weight:700;margin-bottom:2px}
.tooltip .tt-s{color:var(--ink-4);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2)}
.legend .sw{display:inline-flex;align-items:center;gap:6px}
.legend .sw i{width:11px;height:11px;border-radius:3px;display:inline-block}
.attn{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.attn.crit{border-color:var(--crit-soft);background:var(--crit-soft)}
.attn.warn{border-color:var(--warn-soft);background:var(--warn-soft)}
.attn .ai{flex:none;margin-top:1px}
.attn.crit .ai{color:var(--crit)} .attn.warn .ai{color:var(--warn)}
.attn b{font-size:13px} .attn p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}

/* ownership: BC (upstream, steel) vs Flow (this app, cobalt) */
.owner{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.owner.bc{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--border-strong)}
.owner.flow{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.owner .bcmark{width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,#7A8CA6,#5B6B85);display:inline-block}
.step.bc.current{background:var(--surface-3)}
.step.bc.current .snode{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface);box-shadow:0 0 0 4px var(--surface-3)}
.step.bc.current .sname{color:var(--ink)}
.step.bc.done .snode{background:var(--ink-3);border-color:var(--ink-3)}
.handoff{width:0;position:relative}
.handoff::before{content:"⟶ Flow picks up";position:absolute;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--surface);padding:0 6px}
.col.bc{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 9px,var(--surface-3) 9px,var(--surface-3) 10px)}
.wb{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.wb:last-child{border-bottom:0}
.wb .wbi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--good-soft);color:var(--good)}
.wb .wbi.pending{background:var(--warn-soft);color:var(--warn)}
.wb .wbm b{font-weight:650} .wb .wbm .wbt{font-size:11px;color:var(--ink-4);font-family:var(--mono)}
.wb .wbi svg{width:14px;height:14px}
.eyebrow svg{width:13px;height:13px;vertical-align:-2px}
.attn .ai svg{width:17px;height:17px}
.op-signed svg{width:13px;height:13px}
.laborrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.laborrow:last-child{border-bottom:0}
.op-signed{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--good);font-weight:600}
.assignsel{padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>

<script>
"use strict";
/* ============================================================
   FLOW — production execution downstream of Business Central.
   BC owns demand + planning (Planned → Firm Planned → Released),
   and production orders are built from PRODUCTION BOMs.
   Flow picks the order up at RELEASED and owns everything after:
   kitting the BOM → routing → operation sign-offs → labor time,
   posting consumption / output / status back to BC as it goes.
   ============================================================ */

/* lifecycle: 3 stages owned by Business Central, 3 by Flow */
const STAGES=[
  {key:"planned",     name:"Planned",      owner:"bc",  icon:"edit"},
  {key:"firmPlanned", name:"Firm Planned", owner:"bc",  icon:"route"},
  {key:"released",    name:"Released",     owner:"bc",  icon:"shield"},
  {key:"kitting",     name:"Kitting",      owner:"app", icon:"box"},
  {key:"production",  name:"In Production", owner:"app", icon:"factory"},
  {key:"finished",    name:"Finished",     owner:"app", icon:"check"},
];
const stageIndex=k=>STAGES.findIndex(s=>s.key===k);
const HANDOFF=stageIndex("kitting"); // first Flow-owned stage

const WORKCENTERS=[
  {id:"WC-LASER",name:"Laser Cut",cap:16},{id:"WC-BEND",name:"Press Brake",cap:16},
  {id:"WC-WELD",name:"Weld Cell",cap:24},{id:"WC-MACH",name:"CNC Mill",cap:32},
  {id:"WC-PAINT",name:"Powder Coat",cap:8},{id:"WC-ASSY",name:"Assembly",cap:40},
  {id:"WC-QA",name:"Final QA",cap:8},
];
const OPERATORS=["A. Mercer","T. Boyd","L. Nguyen","R. Diaz"];
const QA_INSPECTOR="S. Park";

/* production BOM (components w/ qty-per) + routing per item family */
const FAMILIES={
  frame:{bomNo:"PBOM-FRM-A",routingNo:"RTG-FRM",
    bom:[["STL-CH-3x2","Steel channel 3×2",4],["PLT-6MM","6mm plate 1220×2440",0.25],["WELD-ER70","ER70 wire spool",0.17],["PWD-RAL7016","Powder RAL7016 20kg",0.09],["BRG-6208","Bearing 6208-2RS",2],["FAS-M10","M10 hardware kit",1]],
    routing:[["WC-LASER","Laser cut frame blanks",0.4,1.2],["WC-BEND","Form channels",0.3,0.8],["WC-WELD","Weld sub-frame",0.6,2.4],["WC-PAINT","Powder coat",0.2,1.5],["WC-ASSY","Assemble & fasten",0.8,3.1],["WC-QA","Final inspection",0.2,0.6]]},
  panel:{bomNo:"PBOM-PNL-C",routingNo:"RTG-PNL",
    bom:[["SHT-2MM","2mm sheet 1220×2440",0.5],["HNG-SS","Stainless hinge",2],["PWD-RAL9005","Powder RAL9005 20kg",0.05],["FAS-M6","M6 hardware kit",1]],
    routing:[["WC-LASER","Laser cut panels",0.3,0.9],["WC-BEND","Brake form edges",0.25,0.7],["WC-PAINT","Powder coat",0.2,1.4],["WC-ASSY","Fit hardware",0.5,1.8],["WC-QA","Inspect finish",0.15,0.4]]},
  shaft:{bomNo:"PBOM-SHF",routingNo:"RTG-SHF",
    bom:[["BAR-4140","4140 alloy bar 3m",0.35],["BRG-6209","Bearing 6209-2RS",2],["KEY-12","12mm key stock",1]],
    routing:[["WC-MACH","Turn & mill shaft",0.9,3.6],["WC-MACH","Keyway & drill",0.4,1.4],["WC-QA","CMM inspection",0.3,0.8],["WC-ASSY","Press bearings",0.4,1.2]]},
};

let PDO_SEQ=2044;
function bomFor(family,qty){
  return FAMILIES[family].bom.map(c=>{
    const need=Math.ceil(c[2]*qty);
    const avail=Math.random()<0.85?need:Math.max(0,Math.floor(need*0.6));
    return {part:c[0],name:c[1],per:c[2],need,avail,picked:0,bin:randbin()};
  });
}
function routeFor(family){
  return FAMILIES[family].routing.map((o,i)=>({
    seq:(i+1)*10,wc:o[0],name:o[1],setup:o[2],runEa:o[3],
    status:"pending",operator:null,laborMin:0,signedBy:null,signedAt:null,qtyOut:0,
  }));
}
function mkOrder(o){
  const fam=FAMILIES[o.family];
  return Object.assign({
    id:"PdO-"+(PDO_SEQ++), priority:"normal", scrap:0, good:0, activeOp:0,
    bomNo:fam.bomNo, routingNo:fam.routingNo,
    bom:o.bom||bomFor(o.family,o.qty), routing:routeFor(o.family),
    writeback:[],
  }, o);
}
function randbin(){const a="ABCDEF"[Math.floor(Math.random()*6)];const b=String(Math.floor(Math.random()*40)+1).padStart(2,"0");const c=String(Math.floor(Math.random()*5)+1);return `${a}-${b}-${c}`;}
function nowLabel(){return new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});}

/* ============================================================
   Business Central — demand feeds (system of record for demand)
   Field names mirror BC API v2.0 so a real feed is a 1:1 swap.
   ============================================================ */
const BC={connected:true,environment:"PROD",company:"Laugh Manufacturing Ltd.",lastSync:"2 min ago",tenant:"laugh.onmicrosoft.com"};
const BC_SALESORDERS=[
  {id:"8b1…a01",number:"S-ORD101044",customerName:"Ridgeline Conveyors",orderDate:"2026-07-18",requestedDeliveryDate:"2026-07-31",status:"Open",
    salesOrderLines:[{lineType:"Item",lineObjectNumber:"FRM-1200-A",description:"Conveyor Drive Frame — 1200mm",quantity:24,shippedQuantity:0}]},
  {id:"8b1…a02",number:"S-ORD101051",customerName:"Northgate Automation",orderDate:"2026-07-19",requestedDeliveryDate:"2026-08-05",status:"Open",
    salesOrderLines:[{lineType:"Item",lineObjectNumber:"PNL-GC-04",description:"Guard Panel Set — Type C",quantity:60,shippedQuantity:12},
                     {lineType:"Item",lineObjectNumber:"SHF-45-H",description:"Output Shaft 45mm — Hardened",quantity:40,shippedQuantity:0}]},
  {id:"8b1…a03",number:"S-ORD101052",customerName:"Beltway Systems",orderDate:"2026-07-20",requestedDeliveryDate:"2026-08-12",status:"Open",
    salesOrderLines:[{lineType:"Item",lineObjectNumber:"FRM-900-A",description:"Conveyor Drive Frame — 900mm",quantity:30,shippedQuantity:0}]},
  {id:"8b1…a04",number:"S-ORD101060",customerName:"Ridgeline Conveyors",orderDate:"2026-07-21",requestedDeliveryDate:"2026-08-14",status:"Open",
    salesOrderLines:[{lineType:"Item",lineObjectNumber:"PNL-GA-01",description:"Guard Panel Set — Type A",quantity:48,shippedQuantity:0}]},
];
const BC_FORECAST=[
  {itemNumber:"FRM-1200-A",description:"Conveyor Drive Frame — 1200mm",forecastType:"Sales Item",forecastDate:"2026-08-15",quantity:20},
  {itemNumber:"PNL-GC-04",description:"Guard Panel Set — Type C",forecastType:"Sales Item",forecastDate:"2026-08-15",quantity:40},
  {itemNumber:"SHF-45-H",description:"Output Shaft 45mm — Hardened",forecastType:"Sales Item",forecastDate:"2026-08-15",quantity:25},
  {itemNumber:"SHF-60",description:"Output Shaft 60mm",forecastType:"Sales Item",forecastDate:"2026-08-15",quantity:30},
];
const ON_HAND={"FRM-1200-A":0,"FRM-900-A":6,"PNL-GC-04":0,"PNL-GA-01":10,"SHF-45-H":0,"SHF-60":8};
const CATALOG=[
  {part:"FRM-1200-A",name:"Conveyor Drive Frame — 1200mm",family:"frame"},
  {part:"FRM-900-A",name:"Conveyor Drive Frame — 900mm",family:"frame"},
  {part:"PNL-GC-04",name:"Guard Panel Set — Type C",family:"panel"},
  {part:"PNL-GA-01",name:"Guard Panel Set — Type A",family:"panel"},
  {part:"SHF-45-H",name:"Output Shaft 45mm — Hardened",family:"shaft"},
  {part:"SHF-60",name:"Output Shaft 60mm",family:"shaft"},
];
function itemName(part){const c=CATALOG.find(x=>x.part===part);return c?c.name:part;}
function familyOf(part){const c=CATALOG.find(x=>x.part===part);return c?c.family:"frame";}

/* ============================================================ state + seed */
const state={view:"command",orders:[],selected:null,timer:{running:false,seconds:0,order:null}};

state.orders=[
  mkOrder({item:"FRM-1200-A",product:"Conveyor Drive Frame — 1200mm",qty:24,family:"frame",stage:"firmPlanned",priority:"high",due:"Jul 31",source:"S-ORD101044"}),
  mkOrder({item:"PNL-GC-04",product:"Guard Panel Set — Type C",qty:48,family:"panel",stage:"released",priority:"normal",due:"Aug 05",source:"S-ORD101051"}),
  mkOrder({item:"SHF-45-H",product:"Output Shaft 45mm — Hardened",qty:40,family:"shaft",stage:"kitting",priority:"hot",due:"Aug 05",source:"S-ORD101051"}),
  mkOrder({item:"FRM-900-A",product:"Conveyor Drive Frame — 900mm",qty:30,family:"frame",stage:"production",priority:"normal",due:"Aug 12",source:"S-ORD101052",good:12}),
  mkOrder({item:"SHF-60",product:"Output Shaft 60mm",qty:20,family:"shaft",stage:"finished",priority:"normal",due:"Jul 18",source:"forecast",good:20}),
  mkOrder({item:"PNL-GA-01",product:"Guard Panel Set — Type A",qty:48,family:"panel",stage:"planned",priority:"normal",due:"Aug 14",source:"S-ORD101060"}),
];
// make the hot shaft short one component to demo shortage handling
(function(){const o=state.orders[2];o.bom[0].avail=Math.floor(o.bom[0].need*0.6);})();
// seed the in-production order: kitted + first 2 ops signed off, op3 running
(function(){
  const o=state.orders[3];
  o.bom.forEach(b=>b.picked=Math.min(b.need,b.avail));
  wbPost(o,"Consumption journal",`Kitted ${o.bom.length} BOM lines · ${o.bomNo}`,true);
  const seed=[["A. Mercer",74],["T. Boyd",39]];
  seed.forEach(([op,min],i)=>{o.routing[i].status="done";o.routing[i].operator=op;o.routing[i].signedBy=op;o.routing[i].signedAt="today";o.routing[i].laborMin=min;o.routing[i].qtyOut=o.qty;
    wbPost(o,"Output journal",`Op ${o.routing[i].seq} · ${o.qty} ea · ${(min/60).toFixed(1)}h — ${op}`,true);});
  o.routing[2].status="active";o.routing[2].operator="L. Nguyen";o.activeOp=2;
  state.timer={running:false,seconds:5140,order:o.id};
})();
// seed the finished order fully posted back
(function(){
  const o=state.orders[4];
  o.bom.forEach(b=>b.picked=Math.min(b.need,b.avail));
  wbPost(o,"Consumption journal",`Kitted ${o.bom.length} BOM lines · ${o.bomNo}`,true);
  o.routing.forEach((r,i)=>{r.status="done";r.operator=OPERATORS[i%OPERATORS.length];r.signedBy=r.wc==="WC-QA"?QA_INSPECTOR:r.operator;r.signedAt="Jul 18";r.laborMin=Math.round((r.setup+r.runEa*o.qty)*60);r.qtyOut=o.qty;
    wbPost(o,"Output journal",`Op ${r.seq} · ${o.qty} ea · ${(r.laborMin/60).toFixed(1)}h — ${r.operator}`,true);});
  wbPost(o,"Status → Finished",`Production order closed · ${o.good} good`,true);
})();
state.selected=state.orders[3].id;

/* write-back helper (posts to Business Central) */
function wbPost(o,type,detail,silent){
  o.writeback.unshift({ts:nowLabel(),type,detail,status:"posted"});
  if(!silent)toast(`Posted to Business Central · ${type}`);
}

/* capacity (unchanged model) */
const DAYS=["Mon 21","Tue 22","Wed 23","Thu 24","Fri 25","Mon 28","Tue 29","Wed 30","Thu 31","Fri 01"];
const CAPACITY=(function(){
  const s={"WC-LASER":[9,11,14,13,10,8,12,15,11,9],"WC-BEND":[7,9,12,10,8,6,9,11,9,7],"WC-WELD":[14,18,22,26,20,16,19,23,18,15],"WC-MACH":[20,24,30,28,25,22,27,31,26,21],"WC-PAINT":[5,6,8,9,7,4,6,9,7,5],"WC-ASSY":[26,31,36,34,30,28,33,38,32,27],"WC-QA":[4,5,7,8,6,3,5,8,6,4]};
  return WORKCENTERS.map(wc=>({wc,cap:wc.cap,load:s[wc.id]}));
})();

/* ============================================================ icons */
const I={
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  route:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h6a4 4 0 0 0 4-4V7"/></svg>',
  box:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  shield:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 9.5C8 20.3 5 16.5 5 12V6z"/></svg>',
  factory:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V10l6 4V10l6 4V7l6 3v11z"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  checkc:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  play:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  user:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',

/* ============================================================ helpers */
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function priPill(p){if(p==="hot")return '<span class="pill crit"><span class="dot"></span>Hot</span>';if(p==="high")return '<span class="pill warn"><span class="dot"></span>High</span>';return '<span class="pill neutral">Normal</span>';}
function ownerBadge(owner){return owner==="bc"?'<span class="owner bc"><span class="bcmark"></span>Business Central</span>':'<span class="owner flow">Flow · this app</span>';}
function shortCount(o){return o.bom.filter(p=>p.avail<p.need).length;}
function kitProgress(o){if(!o.bom.length)return 0;const t=o.bom.reduce((a,p)=>a+p.need,0);const d=o.bom.reduce((a,p)=>a+Math.min(p.picked,p.need),0);return Math.round(d/t*100);}
function opProgress(o){const done=o.routing.filter(r=>r.status==="done").length;return Math.round(done/o.routing.length*100);}
function laborHrs(o){return o.routing.reduce((a,r)=>a+r.laborMin,0)/60;}
function selOrder(){return state.orders.find(o=>o.id===state.selected);}
function toast(msg){const t=el(`<div class="toast">${I.checkc}<span>${msg}</span></div>`);document.getElementById("toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(8px)";setTimeout(()=>t.remove(),250);},2600);}
function seqColor(pct){if(pct>100)return null;const s=["--seq-0","--seq-1","--seq-2","--seq-3","--seq-4","--seq-5"];return `var(${s[Math.min(5,Math.floor(pct/100*5.999))]})`;}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;}

/* -------- shared: lifecycle stepper with ownership -------- */
function stepper(o){
  const cur=stageIndex(o.stage);

    if(k==="firmPlanned")return o.bomNo;
    if(k==="released")return "picked up by Flow";
    if(k==="kitting")return `${kitProgress(o)}% kitted`;
    if(k==="production")return `${opProgress(o)}% ops`;
    if(k==="finished")return "posted to BC";
    return "";
  };
  return `<div style="display:flex;justify-content:space-between;margin-bottom:8px;padding:0 4px">
      <span class="owner bc"><span class="bcmark"></span>Business Central · planning</span>
      <span class="owner flow">Flow · execution &amp; write-back</span></div>
    <div class="stepper" role="list">${STAGES.map((s,i)=>{
    const cls=(i<cur?"done":i===cur?"current":"")+(s.owner==="bc"?" bc":"");
    return `<div class="step ${cls}" role="listitem">
      <div class="snode">${i<cur?I.check:`<span>${i+1}</span>`}</div>
      <div class="sname">${s.name}</div>
      <div class="smeta">${meta(s.key)}</div>
    </div>`;}).join("")}</div>`;
}

function statTile(label,val,unit,tone,delta,sparkSvg){
  return `<div class="card stat"><div class="label">${label}</div>
    <div class="val">${val}<small> ${unit}</small></div>
    <div class="delta up" ${tone?`style="color:var(--${tone})"`:""}>${delta}</div>
    <div class="spark">${sparkSvg}</div></div>`;
}
function spark(vals){const w=64,h=26,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-((v-min)/rng)*(h-4)-2]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M0 ${h} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${w} ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.4" fill="var(--accent)"/></svg>`;
}

/* net requirements: demand − on-hand − open production orders */
function planRequirements(){
  const items={};
  const add=(part,desc,qty,src)=>{items[part]=items[part]||{part,desc,so:0,fc:0,onHand:ON_HAND[part]||0,onOrder:0};items[part][src]+=qty;};
  BC_SALESORDERS.forEach(o=>o.salesOrderLines.forEach(l=>{const open=l.quantity-l.shippedQuantity;if(open>0)add(l.lineObjectNumber,l.description,open,"so");}));
  BC_FORECAST.forEach(f=>add(f.itemNumber,f.description,f.quantity,"fc"));
  state.orders.filter(o=>o.stage!=="finished").forEach(o=>{if(items[o.item])items[o.item].onOrder+=o.qty;});
  return Object.values(items).map(it=>{const gross=it.so+it.fc;const net=Math.max(0,gross-it.onHand-it.onOrder);return {...it,gross,net,covered:net===0};}).sort((a,b)=>b.net-a.net);
}

    });
    if(!items.length)col.appendChild(el(`<div class="sub" style="padding:6px 2px">—</div>`));
    cols.appendChild(col);
  });
  pipe.appendChild(cols);
  canvas.appendChild(pipe);

  ptb.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click",()=>createPlanned(b.dataset.plan,+b.dataset.qty)));
  cols.querySelectorAll("[data-firm]").forEach(b=>b.addEventListener("click",()=>{const o=byId(b.dataset.firm);o.stage="firmPlanned";toast(`${o.id} firm planned in BC`);render();}));
  cols.querySelectorAll("[data-release]").forEach(b=>b.addEventListener("click",()=>{const o=byId(b.dataset.release);o.stage="released";toast(`${o.id} released in BC — picked up by Flow`);render();}));
  cols.querySelectorAll("[data-tokit]").forEach(b=>b.addEventListener("click",()=>{state.selected=b.dataset.tokit;go("kitting");}));
}
function byId(id){return state.orders.find(o=>o.id===id);}
function createPlanned(part,qty){
  const fam=familyOf(part);
  const o=mkOrder({item:part,product:itemName(part),qty,family:fam,stage:"planned",priority:"normal",due:"Aug 15",source:"planning"});
  state.orders.unshift(o);
  toast(`Planned order ${o.id} created from ${o.bomNo}`);
  render();
}

/* ============================================================ 4. KITTING (production BOM) */
function viewKitting(){
  const pick=orderPicker(["released","kitting"]);
  canvas.appendChild(el(pick.html)); wireOrderPicker();
  if(!pick.list.length){canvas.appendChild(el(`<div class="card pad muted">No orders released from Business Central yet. Release one in Planning.</div>`));return;}
  const o=selOrder();
  canvas.appendChild(el(`<div style="margin-bottom:16px">${stepper(o)}</div>`));

  const allKitted=o.bom.every(p=>p.picked>=Math.min(p.need,p.avail));
  const advance=allKitted
    ? `<button class="btn good" id="issueBtn">${I.checkc}Complete kit &amp; issue to floor</button>`
    : `<button class="btn primary" id="kitAll">Kit all available</button>`;
  canvas.appendChild(el(orderHeader(o,advance)));

  if(shortCount(o))canvas.appendChild(el(`<div class="attn warn" style="margin-bottom:16px"><span class="ai">${I.alert}</span><div><b>${shortCount(o)} BOM line(s) short</b><p>Kit what's on hand and backorder the rest — short lines won't block the others. Consumption for what you kit posts back to Business Central.</p></div></div>`));

  const card=el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="pad" style="border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <div><div class="eyebrow">Production BOM · ${o.bomNo}</div><span class="sub">Components from Business Central · bin-sequenced</span></div>
    <span class="pill accent">${o.bom.length} lines</span></div>`));
  const tbl=el(`<table class="tbl"><thead><tr><th>Component</th><th>Bin</th><th class="right">Per unit</th><th class="right">Required</th><th class="right">Avail</th><th class="right">Kitted</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector("tbody");
  o.bom.forEach((p,i)=>{const short=p.avail<p.need;const done=p.picked>=Math.min(p.need,p.avail);
    tb.appendChild(el(`<tr><td><b style="font-weight:650">${p.name}</b><br><span class="tag">${p.part}</span></td>
      <td><span class="mono" style="font-weight:600">${p.bin}</span></td>
      <td class="right num muted">${p.per}</td>
      <td class="right num">${p.need}</td>
      <td class="right num" style="color:${short?'var(--crit)':'var(--ink)'}">${p.avail}</td>
      <td class="right num" style="font-weight:700">${p.picked}</td>
      <td>${done?'<span class="pill good"><span class="dot"></span>Kitted</span>':short?'<span class="pill warn"><span class="dot"></span>Short</span>':'<span class="pill neutral">Pending</span>'}</td>
      <td class="right">${done?"":`<button class="btn sm" data-kit="${i}">Kit ${Math.min(p.need,p.avail)}</button>`}</td></tr>`));});
  card.appendChild(el(`<div style="overflow-x:auto"></div>`)).appendChild(tbl);
  canvas.appendChild(card);

  tb.querySelectorAll("[data-kit]").forEach(b=>b.addEventListener("click",()=>{const p=o.bom[+b.dataset.kit];p.picked=Math.min(p.need,p.avail);if(o.stage==="released")o.stage="kitting";toast(`Kitted ${p.picked} × ${p.part}`);render();}));
  const ka=document.getElementById("kitAll");
  if(ka)ka.addEventListener("click",()=>{o.bom.forEach(p=>p.picked=Math.min(p.need,p.avail));o.stage="kitting";toast("Kitted all available lines");render();});
  const ib=document.getElementById("issueBtn");
  if(ib)ib.addEventListener("click",()=>{o.stage="production";o.routing[0].status="active";state.timer={running:false,seconds:0,order:o.id};wbPost(o,"Consumption journal",`Kitted ${o.bom.length} BOM lines · ${o.bomNo}`);go("floor");});
}

/* ============================================================ 5. FLOOR TERMINAL — routing + sign-off + labor + write-back */
let timerHandle=null;
function viewFloor(){
  const running=state.orders.filter(o=>o.stage==="production");
  canvas.appendChild(el(`<div class="row" style="margin-bottom:16px;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div><div class="eyebrow">Floor terminal</div><h2 class="h2">On the floor now</h2></div><div class="wrap" id="floorTabs"></div></div>`));
  const tabs=document.getElementById("floorTabs");
  running.forEach(o=>{const b=el(`<button class="btn sm ${o.id===state.selected?'primary':''}">${o.id} · ${o.item}</button>`);b.addEventListener("click",()=>{state.selected=o.id;render();});tabs.appendChild(b);});
  let o=selOrder();
  if(!o||o.stage!=="production"){o=running[0];if(o)state.selected=o.id;}
  if(!o){canvas.appendChild(el(`<div class="card pad muted">No orders on the floor. Issue a kitted order from Kitting.</div>`));return;}

  canvas.appendChild(el(`<div style="margin-bottom:16px">${stepper(o)}</div>`));

  const cur=o.routing.findIndex(r=>r.status==="active");
  const nextIdx=o.routing.findIndex(r=>r.status==="pending");

  const split=el(`<div class="split"></div>`);
  const travel=el(`<div></div>`);
  o.routing.forEach((op,i)=>{
    const wc=WORKCENTERS.find(w=>w.id===op.wc);
    const isActive=op.status==="active";const isDone=op.status==="done";
    const isNext=i===nextIdx&&cur<0;
    const card=el(`<div class="opcard ${isActive?'active':''}" style="margin-bottom:12px">
      <div class="oc-head"><div class="row"><span class="seq">${op.seq}</span><div><b style="font-size:13.5px">${op.name}</b><br><span class="tag" style="font-size:11px">${wc.name}</span></div></div>
      ${isDone?'<span class="pill good"><span class="dot"></span>Signed off</span>':isActive?'<span class="pill accent"><span class="dot"></span>Running</span>':'<span class="pill neutral">Queued</span>'}</div>
      <div class="oc-body"></div></div>`);
    const body=card.querySelector(".oc-body");
    if(isActive){
      body.appendChild(el(`<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><div class="eyebrow">Run time</div><div class="timer" id="floorTimer">${fmtTime(state.timer.order===o.id?state.timer.seconds:0)}</div></div>
        <div style="text-align:right"><div class="eyebrow">Operator</div>
          <select class="assignsel" id="opOperator" style="margin-top:4px">${OPERATORS.map(n=>`<option ${n===op.operator?"selected":""}>${n}</option>`).join("")}</select></div></div>`));
      body.appendChild(el(`<div class="qtybox"><div class="qb good"><div class="qv" id="qGood">${o.good}</div><div class="ql">Good</div></div><div class="qb scrap"><div class="qv" id="qScrap">${o.scrap}</div><div class="ql">Scrap</div></div></div>`));
      body.appendChild(el(`<div class="stepbtns"><button class="btn sm" id="repGood">+ Good</button><button class="btn sm" id="repScrap">+ Scrap</button></div>`));
      body.appendChild(el(`<div class="stepbtns" style="margin-top:10px"><button class="btn ${state.timer.running?'':'primary'}" id="toggleRun">${state.timer.running?I.pause+'Pause':I.play+'Start'}</button><button class="btn good" id="completeOp">${I.pen}Sign off &amp; complete</button></div>`));
      body.appendChild(el(`<p class="sub" style="margin-top:10px;font-size:11.5px">Completing posts an <b>output journal</b> (qty + run time) to Business Central against this operation.</p>`));
    } else if(isDone){
      body.appendChild(el(`<div class="row" style="justify-content:space-between"><span class="sub">Qty output</span><b class="num">${op.qtyOut}</b></div>
        <div class="row" style="justify-content:space-between;margin-top:6px"><span class="sub">Labor</span><b class="num">${(op.laborMin/60).toFixed(1)}h</b></div>
        <div class="op-signed" style="margin-top:10px">${I.checkc}Signed off by ${op.signedBy}${op.wc==="WC-QA"?" (QA)":""} · ${op.signedAt}</div>`));
    } else {
      body.appendChild(el(`<div class="sub">Queued at ${wc.name}.</div>
        <div class="row" style="justify-content:space-between;margin-top:10px"><span class="sub">Std time</span><b class="num">${(op.setup+op.runEa*o.qty).toFixed(1)}h</b></div>
        ${isNext?`<button class="btn sm primary" id="startNext" style="width:100%;margin-top:12px">${I.play}Start operation</button>`:""}`));
    }
    travel.appendChild(card);
  });
  split.appendChild(travel);

  // right column: labor log + write-back
  const right=el(`<div></div>`);
  const labor=el(`<div class="card pad" style="margin-bottom:16px"></div>`);
  labor.appendChild(el(`<div class="eyebrow" style="margin-bottom:8px">${I.user} Labor by operator</div>`));
  const logged=o.routing.filter(r=>r.laborMin>0);
  if(logged.length){logged.forEach(r=>labor.appendChild(el(`<div class="laborrow"><span class="seq">${r.seq}</span><div style="flex:1"><b style="font-size:12.5px;font-weight:650">${r.operator||"—"}</b><br><span class="muted" style="font-size:11.5px">${r.name}</span></div><b class="num">${(r.laborMin/60).toFixed(1)}h</b></div>`)));
    labor.appendChild(el(`<div class="row" style="justify-content:space-between;padding-top:10px;margin-top:2px;border-top:1px solid var(--border-strong)"><b style="font-size:12.5px">Total booked</b><b class="num">${laborHrs(o).toFixed(1)}h</b></div>`));}
  else labor.appendChild(el(`<div class="sub">No labor booked yet.</div>`));
  right.appendChild(labor);

  const wb=el(`<div class="card pad"></div>`);
  wb.appendChild(el(`<div class="eyebrow" style="margin-bottom:8px">${I.sync} Posted to Business Central</div>`));
  if(o.writeback.length)o.writeback.forEach(w=>wb.appendChild(el(`<div class="wb"><span class="wbi">${I.checkc}</span><div class="wbm"><b>${w.type}</b><br><span class="muted" style="font-size:12px">${w.detail}</span> <span class="wbt">${w.ts}</span></div></div>`)));
  else wb.appendChild(el(`<div class="sub">Nothing posted yet.</div>`));
  right.appendChild(wb);
  split.appendChild(right);
  canvas.appendChild(split);

  // wire
  const tr=document.getElementById("toggleRun");
  if(tr)tr.addEventListener("click",()=>{state.timer.running=!state.timer.running;state.timer.order=o.id;tickSetup();render();});
  const rg=document.getElementById("repGood");
  if(rg)rg.addEventListener("click",()=>{if(o.good<o.qty){o.good++;document.getElementById("qGood").textContent=o.good;}else toast("Order quantity reached");});
  const rs=document.getElementById("repScrap");
  if(rs)rs.addEventListener("click",()=>{o.scrap++;document.getElementById("qScrap").textContent=o.scrap;toast("Scrap logged");});
  const co=document.getElementById("completeOp");
  if(co)co.addEventListener("click",()=>completeOp(o,cur));
  const sn=document.getElementById("startNext");
  if(sn)sn.addEventListener("click",()=>{o.routing[nextIdx].status="active";state.timer={running:true,seconds:0,order:o.id};tickSetup();render();});
  tickSetup();
}
function completeOp(o,i){
  const op=o.routing[i];const wc=op.wc;
  op.operator=document.getElementById("opOperator")?document.getElementById("opOperator").value:op.operator||OPERATORS[0];
  op.status="done";
  op.laborMin=Math.max(1,Math.round(state.timer.seconds/60))||Math.round((op.setup+op.runEa*o.qty)*60);
  op.qtyOut=o.good||o.qty;
  op.signedBy=wc==="WC-QA"?QA_INSPECTOR:op.operator;
  op.signedAt=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"});
  wbPost(o,"Output journal",`Op ${op.seq} · ${op.qtyOut} ea · ${(op.laborMin/60).toFixed(1)}h — ${op.operator}`);
  state.timer={running:false,seconds:0,order:o.id};
  const next=o.routing.findIndex(r=>r.status==="pending");
  if(next>=0){o.routing[next].status="active";toast(`Signed off — advancing to ${o.routing[next].name}`);}
  else{o.stage="finished";wbPost(o,"Status → Finished",`Production order closed · ${o.good||o.qty} good, ${o.scrap} scrap`);toast(`${o.id} finished — posted to Business Central`);go("command");return;}
  render();
}
function tickSetup(){
  if(timerHandle)clearInterval(timerHandle);
  if(state.timer.running){timerHandle=setInterval(()=>{state.timer.seconds++;const t=document.getElementById("floorTimer");if(t)t.textContent=fmtTime(state.timer.seconds);else clearInterval(timerHandle);},1000);}
}

/* ============================================================ 6. CAPACITY */
function viewCapacity(){
  canvas.appendChild(el(`<div class="section-head"><div><div class="eyebrow">Finite scheduling</div><h2 class="h2">Capacity by work center</h2><p class="sub">Committed load vs. available hours per day. Red cells are over capacity.</p></div>
    <div class="legend"><span class="sw"><i style="background:var(--seq-1)"></i>light</span><span class="sw"><i style="background:var(--seq-3)"></i>busy</span><span class="sw"><i style="background:var(--seq-5)"></i>near full</span><span class="sw"><i style="background:var(--crit)"></i>over</span></div></div>`));
  const wrap=el(`<div class="card pad" style="overflow-x:auto"></div>`);
  const t=el(`<table class="heat"><thead><tr><th style="text-align:left">Work center</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody></tbody></table>`);
  const tb=t.querySelector("tbody");
  CAPACITY.forEach(row=>{const tr=el(`<tr><td class="wc">${row.wc.name}<small>${row.wc.id} · ${row.cap}h/day</small></td></tr>`);
    row.load.forEach((h,di)=>{const pct=Math.round(h/row.cap*100);const over=pct>100;const bg=over?"var(--crit)":seqColor(pct);
      tr.appendChild(el(`<td><div class="cell ${over?'over':''}" style="background:${bg}" data-tt="${row.wc.name} · ${DAYS[di]}" data-tt2="${h}h of ${row.cap}h — ${pct}%">${pct}%</div></td>`));});
    tb.appendChild(tr);});
  wrap.appendChild(t);canvas.appendChild(wrap);

  const overCells=[];CAPACITY.forEach(row=>row.load.forEach((h,di)=>{if(h/row.cap>1)overCells.push({wc:row.wc.name,day:DAYS[di],pct:Math.round(h/row.cap*100)});}));
  const s=el(`<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-top:18px"></div>`);
  const b1=el(`<div class="card pad"></div>`);b1.appendChild(el(`<div class="eyebrow" style="margin-bottom:10px">Overloaded slots · ${overCells.length}</div>`));
  if(overCells.length)overCells.slice(0,5).forEach(c=>b1.appendChild(el(`<div class="attn warn" style="margin-bottom:8px"><span class="ai">${I.alert}</span><div><b>${c.wc} — ${c.day}</b><p>Committed to ${c.pct}% of capacity. Pull earlier or add a shift.</p></div></div>`)));
  else b1.appendChild(el(`<div class="sub">Nothing over capacity this window.</div>`));
  s.appendChild(b1);
  const b2=el(`<div class="card pad"></div>`);b2.appendChild(el(`<div class="eyebrow" style="margin-bottom:10px">This week's peak per work center</div>`));
  CAPACITY.forEach(row=>{const peak=Math.max(...row.load);const pct=Math.round(peak/row.cap*100);const over=pct>100;
    b2.appendChild(el(`<div class="loadbar"><span class="lbl">${row.wc.name}</span><span class="track"><span class="fill" style="width:${Math.min(pct,100)}%;background:${over?'var(--crit)':pct>85?'var(--warn)':'var(--accent)'}"></span><span class="capline"></span></span><span class="pct" style="color:${over?'var(--crit)':'var(--ink-2)'}">${pct}%</span></div>`));});
  s.appendChild(b2);canvas.appendChild(s);

  const tip=document.getElementById("tooltip");
  wrap.querySelectorAll(".cell").forEach(c=>{c.addEventListener("mousemove",e=>{tip.innerHTML=`<div class="tt-t">${c.dataset.tt}</div><div class="tt-s">${c.dataset.tt2}</div>`;tip.style.opacity="1";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px";});c.addEventListener("mouseleave",()=>tip.style.opacity="0");});
}

/* ============================================================ theme + boot */
document.getElementById("themeBtn").addEventListener("click",()=>{const root=document.documentElement;const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");root.setAttribute("data-theme",cur==="dark"?"light":"dark");});
go("command");
</script>
